<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="sm" id="sm" hidden>
    <div class="head"><span class="place" id="place"></span><span class="moon" id="moon"></span></div>
    <div class="next" id="next"></div>
    <svg class="sky" id="sky" viewBox="0 0 200 74" preserveAspectRatio="xMidYMax meet" aria-hidden="true"></svg>
    <div class="times" id="times"></div>
    <div class="length" id="length"></div>
  </main>
  <div class="msg" id="msg">
    <span id="msg-text"></span>
    <button class="w-btn" id="retry" data-no-drag hidden></button>
  </div>
  <script src="/__fw/places.js"></script>
  <script src="main.js"></script>
</body>
</html>
