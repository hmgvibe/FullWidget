<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="frame" id="frame">
    <figure class="layer" id="a"><img alt="" draggable="false"></figure>
    <figure class="layer" id="b"><img alt="" draggable="false"></figure>
    <button class="nav prev" id="prev" data-no-drag><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6l-6 6 6 6"/></svg></button>
    <button class="nav next" id="next" data-no-drag><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 6l6 6-6 6"/></svg></button>
  </div>
  <div class="caption" id="caption"><span id="cap-text"></span><span class="count w-num" id="count"></span></div>
  <div class="empty" id="empty" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="1.5"/><path d="M3.5 16l5-4.5 4 3.5 3-2.5 5 4"/><circle cx="15.5" cy="9" r="1.5"/></svg>
    <p id="empty-text"></p>
    <button class="w-btn" id="pick" data-no-drag></button>
  </div>
  <script src="main.js"></script>
</body>
</html>
