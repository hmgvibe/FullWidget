<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <figure class="pic" id="pic">
    <div class="frame"><img id="img" alt="" draggable="false"></div>
    <figcaption class="cap" id="cap">
      <span class="title" id="title"></span>
      <span class="credit" id="credit"></span>
    </figcaption>
    <nav class="nav" data-no-drag>
      <button class="arrow prev" id="prev" aria-label=""><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <span class="day" id="day"></span>
      <button class="arrow next" id="next" aria-label=""><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    </nav>
  </figure>
  <div class="msg" id="msg" hidden><span id="msg-text"></span><button class="w-btn" id="retry" data-no-drag></button></div>
  <script src="main.js"></script>
</body>
</html>
