<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wx" id="wx" hidden>
    <div class="top">
      <div class="now">
        <div class="place" id="place"></div>
        <div class="temp w-display" id="temp"></div>
      </div>
      <div class="side">
        <div class="hl" id="hl"></div>
        <div class="note" id="note"></div>
      </div>
    </div>
    <div class="chart" id="chart"><svg id="curve"></svg></div>
    <div class="hours w-num" id="hours"></div>
    <table class="table" id="table"></table>
    <div class="stale w-label" id="stale"></div>
  </main>
  <div class="msg" id="msg">
    <span id="msg-text"></span>
    <button class="w-btn" id="retry" data-no-drag hidden></button>
  </div>
  <script src="/__fw/places.js"></script>
  <script src="main.js"></script>
</body>
</html>
