<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="todo">
    <header>
      <span class="title w-title" id="title"></span>
      <span class="count" id="count"></span>
    </header>
    <div class="w-bar progress"><i id="prog"></i></div>
    <ul class="list" id="list"></ul>
    <div class="empty w-label" id="empty"></div>
    <footer>
      <form id="add"><input class="w-input" id="new" autocomplete="off" maxlength="200"></form>
      <button class="w-btn clear" id="clear" data-no-drag hidden></button>
    </footer>
  </main>
  <script src="main.js"></script>
</body>
</html>
