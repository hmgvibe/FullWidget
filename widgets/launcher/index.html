<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="grid" id="grid"></div>
  <button class="w-btn edit" id="edit" data-no-drag></button>

  <div class="adder" id="adder" hidden data-no-drag>
    <button class="w-btn" id="add-app"></button>
    <button class="w-btn" id="add-folder"></button>
    <button class="w-btn" id="add-url"></button>
    <form class="url" id="url-form" hidden>
      <input class="w-input" id="url" type="text" spellcheck="false" autocomplete="off">
      <button class="w-btn is-primary" id="url-ok"></button>
    </form>
  </div>

  <div class="drop" id="drop"><span id="drop-text"></span></div>
  <script src="main.js"></script>
</body>
</html>
