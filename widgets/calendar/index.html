<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="cal">
    <header>
      <div class="today">
        <span class="w-display dnum" id="dnum"></span>
        <span class="meta"><span id="wk"></span><span class="lunar" id="lunar"></span></span>
      </div>
      <nav>
        <button class="w-btn" id="prev" data-no-drag>‹</button>
        <button class="w-btn month" id="month" data-no-drag></button>
        <button class="w-btn" id="next" data-no-drag>›</button>
      </nav>
    </header>
    <div class="w-bar progress"><i id="prog"></i></div>
    <div class="grid" id="grid"></div>
  </main>
  <script src="main.js"></script>
</body>
</html>
