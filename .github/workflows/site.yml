# Publishes the website (site/) to GitHub Pages: on changes to the site, and whenever a release is
# published, so the version and download links on the page follow the latest release.
name: Website
on:
  push:
    branches: [main]
    paths: ['site/**', 'sdk/**', 'widgets/**', 'src/FullWidget/FullWidget.csproj', '.github/workflows/site.yml']
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  actions: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  # A release run starts from its tag, which Pages refuses to deploy; hand over to a run on main.
  relay:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - run: gh workflow run site.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ github.token }}
  build:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node site/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
