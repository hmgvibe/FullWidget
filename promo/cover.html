<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>FullWidget cover</title>
  <!-- The video cover: the headline on a dark wall of real widgets.
       cover.html?ar=16x9|4x3&lang=zh-TW|zh-CN|en (1920×1080 or 1440×1080). render.mjs --covers saves all six. -->
  <link rel="stylesheet" href="promo.css">
  <style>
    html, body { background: var(--dark); overflow: hidden; }
    #c { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--dark); }
    .r43 #c { width: 1440px; }
    .shot { position: relative; padding: 18px; border-radius: 24px; overflow: hidden; box-shadow: 0 40px 70px -40px rgba(0, 0, 0, 0.7), inset 0 0 0 1px rgba(255, 255, 255, 0.08); }
    .shot::before { content: ""; position: absolute; inset: 0; background: radial-gradient(120% 70% at 20% 0%, rgba(255, 255, 255, 0.22), transparent 60%); }
    .shot img { position: relative; width: 100%; height: auto; filter: drop-shadow(0 12px 22px rgba(0, 0, 0, 0.3)); }
    .wall { position: absolute; inset: -60px -40px; display: grid; grid-template-columns: repeat(6, 1fr); gap: 26px; transform: rotate(-8deg) scale(1.12); transform-origin: 70% 50%; }
    .r43 .wall { grid-template-columns: repeat(5, 1fr); transform-origin: 85% 50%; }
    .shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(14, 16, 19, 0.97) 0%, rgba(14, 16, 19, 0.9) 36%, rgba(14, 16, 19, 0.4) 60%, rgba(14, 16, 19, 0.12) 100%); }
    .r43 .shade { background: linear-gradient(90deg, rgba(14, 16, 19, 0.97) 0%, rgba(14, 16, 19, 0.9) 48%, rgba(14, 16, 19, 0.45) 72%, rgba(14, 16, 19, 0.15) 100%); }
    .brand { position: absolute; left: 116px; top: 120px; display: flex; align-items: center; gap: 22px; font: 700 54px/1 var(--display); letter-spacing: -0.03em; color: #fff; }
    .brand img { width: 74px; height: 74px; }
    .h { position: absolute; left: 110px; top: 300px; font: 800 150px/1.04 var(--display); letter-spacing: -0.04em; color: #fff; white-space: nowrap; text-shadow: 0 6px 40px rgba(0, 0, 0, 0.5); }
    .h em { font-style: normal; background: linear-gradient(90deg, #4cc9f0, #9b5de5 45%, #f2b45c); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
    :lang(en) .h { top: 262px; font-size: 128px; line-height: 1.02; }
    .s { position: absolute; left: 116px; top: 690px; font: 600 44px/1.3 var(--sans); color: var(--on-dark); white-space: nowrap; }
    .pill { position: absolute; left: 116px; top: 800px; display: flex; gap: 16px; }
    .pill b { font: 700 34px/1 var(--sans); padding: 18px 28px; border-radius: 999px; background: rgba(255, 255, 255, 0.12); color: #fff; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.14); backdrop-filter: blur(8px); }
    .pill b.m { background: var(--mint); color: #0b1512; box-shadow: none; }
  </style>
</head>
<body>
  <div id="c"></div>
  <script>
    const q = new URLSearchParams(location.search);
    const lang = ["zh-TW", "zh-CN", "en"].includes(q.get("lang")) ? q.get("lang") : "zh-TW";
    document.documentElement.lang = lang === "zh-TW" ? "zh-Hant" : lang;
    document.body.className = q.get("ar") === "4x3" ? "r43" : "r169";
    const TXT = {
      "zh-TW": { h: "桌面也可以<br><em>很好看</em>", s: "免費、開源的 Windows 11 桌面小組件", pills: ["38 個組件", "3 套主題", "可以自己寫"] },
      "zh-CN": { h: "桌面也可以<br><em>很好看</em>", s: "免费、开源的 Windows 11 桌面小组件", pills: ["38 个组件", "3 套主题", "可以自己写"] },
      en: { h: "Your desktop<br>can look<br><em>this good</em>", s: "Free, open-source widgets for Windows 11", pills: ["38 widgets", "3 themes", "Write your own"] },
    }[lang];
    const c = document.getElementById("c");
    const add = (cls, html, parent = c) => { const d = document.createElement("div"); d.className = cls; d.innerHTML = html; parent.append(d); return d; };
    const pic = (f) => f === "clock" ? `assets/clock-0941.instrument.${lang}.png` : `../site/assets/widgets/${f}/instrument.${lang}.webp`;

    const wall = add("wall", "");
    ["clock", "weather", "sysinfo", "calendar", "media", "todo", "flipclock", "forecast", "usage", "pomodoro", "notes", "currency",
      "analogclock", "netspeed", "worldclock", "habits", "airquality", "whitenoise", "calculator", "photoframe", "timer", "rss", "sunmoon", "countdown"]
      .forEach((f, i) => add(`shot wp${i % 6}`, `<img src="${pic(f)}">`, wall));
    add("shade", "");
    add("brand", `<img src="../build/logo/logo.svg">FullWidget`);
    add("h", TXT.h);
    add("s", TXT.s);
    add("pill", TXT.pills.map((p, i) => `<b class="${i === 2 ? "m" : ""}">${p}</b>`).join(""));

    window.PROMO_ASSET = Promise.all([...document.images].map((i) => i.complete ? 0 : new Promise((r) => { i.onload = i.onerror = r; })))
      .then(() => document.fonts.ready).then(() => new Promise((r) => setTimeout(r, 300))).then(() => true);
  </script>
</body>
</html>
