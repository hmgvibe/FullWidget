<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>FullWidget cover</title>
  <!-- Video covers, 1920×1080: cover.html?v=1|2&lang=zh-TW|zh-CN|en. render.mjs --covers saves all six. -->
  <link rel="stylesheet" href="promo.css">
  <style>
    html, body { background: var(--bg); overflow: hidden; }
    #c { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
    .shot { position: absolute; padding: 26px; border-radius: 34px; box-shadow: 0 50px 90px -40px rgba(17, 19, 22, 0.55), inset 0 0 0 1px rgba(255, 255, 255, 0.08); overflow: hidden; }
    .shot::before { content: ""; position: absolute; inset: 0; background: radial-gradient(120% 70% at 20% 0%, rgba(255, 255, 255, 0.22), transparent 60%); }
    .shot img { position: relative; width: 100%; height: auto; filter: drop-shadow(0 12px 22px rgba(0, 0, 0, 0.3)); }
    .brand { position: absolute; display: flex; align-items: center; gap: 22px; font: 700 54px/1 var(--display); letter-spacing: -0.03em; }
    .brand img { width: 74px; height: 74px; }
    /* cover 1: light */
    .v1 .h { position: absolute; left: 110px; top: 300px; font: 800 150px/1.04 var(--display); letter-spacing: -0.04em; color: var(--ink); white-space: nowrap; }
    .v1 .h em { font-style: normal; background: linear-gradient(90deg, #4cc9f0, #9b5de5 45%, #f2b45c); -webkit-background-clip: text; background-clip: text; color: transparent; }
    :lang(en) .v1 .h, .v1:lang(en) .h { top: 262px; font-size: 128px; line-height: 1.02; }
    .v1 .s { position: absolute; left: 116px; top: 690px; font: 600 44px/1.3 var(--sans); color: var(--muted); white-space: nowrap; }
    .v1 .pill { position: absolute; left: 116px; top: 800px; display: flex; gap: 16px; }
    .pill b { font: 700 34px/1 var(--sans); padding: 18px 28px; border-radius: 999px; background: var(--ink); color: #fff; }
    .pill b.m { background: var(--mint); color: #0b1512; }
    /* cover 2: graphite */
    .v2 #c { background: var(--dark); }
    .v2 .wall { position: absolute; inset: -60px -40px; display: grid; grid-template-columns: repeat(6, 1fr); gap: 26px; transform: rotate(-8deg) scale(1.12); transform-origin: 70% 50%; opacity: 0.95; }
    .v2 .wall .shot { position: relative; padding: 18px; border-radius: 24px; }
    .v2 .shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(14, 16, 19, 0.98) 0%, rgba(14, 16, 19, 0.92) 38%, rgba(14, 16, 19, 0.35) 62%, rgba(14, 16, 19, 0.1) 100%); }
    .v2 .n { position: absolute; left: 100px; top: 150px; font: 800 440px/0.86 var(--display); letter-spacing: -0.05em; color: #fff; }
    .v2 .u { position: absolute; left: 112px; top: 560px; font: 800 96px/1.05 var(--display); letter-spacing: -0.03em; color: #fff; white-space: nowrap; }
    .v2 .s { position: absolute; left: 116px; top: 700px; font: 600 42px/1.3 var(--sans); color: var(--mint); white-space: nowrap; }
    .v2 .brand { color: #fff; }
  </style>
</head>
<body>
  <div id="c"></div>
  <script>
    const q = new URLSearchParams(location.search);
    const lang = ["zh-TW", "zh-CN", "en"].includes(q.get("lang")) ? q.get("lang") : "zh-TW", v = q.get("v") === "2" ? 2 : 1;
    document.documentElement.lang = lang === "zh-TW" ? "zh-Hant" : lang;
    document.body.className = `v${v}`;
    const TXT = {
      "zh-TW": { h: "桌面也可以<br><em>很好看</em>", s: "免費、開源的 Windows 11 桌面小組件", pills: ["38 個組件", "3 套主題", "可以自己寫"], u: "個桌面小組件", s2: "免費 · 開源 · 什麼都不收集" },
      "zh-CN": { h: "桌面也可以<br><em>很好看</em>", s: "免费、开源的 Windows 11 桌面小组件", pills: ["38 个组件", "3 套主题", "可以自己写"], u: "个桌面小组件", s2: "免费 · 开源 · 什么都不收集" },
      en: { h: "Your desktop<br>can look<br><em>this good</em>", s: "Free, open-source widgets for Windows 11", pills: ["38 widgets", "3 themes", "Write your own"], u: "desktop widgets", s2: "Free · Open source · Collects nothing" },
    }[lang];
    const c = document.getElementById("c");
    const add = (cls, html, parent = c) => { const d = document.createElement("div"); d.className = cls; d.innerHTML = html; parent.append(d); return d; };
    const pic = (f) => f === "clock" ? `assets/clock-0941.instrument.${lang}.png` : `../site/assets/widgets/${f}/instrument.${lang}.webp`;
    const card = (parent, f, wp, css = "") => add(`shot wp${wp}`, `<img src="${pic(f)}">`, parent).setAttribute("style", css);
    const brand = (css) => add("brand", `<img src="../build/logo/logo.svg">FullWidget`).setAttribute("style", css);

    if (v === 1) {
      brand("left: 116px; top: 120px;");
      add("h", TXT.h);
      add("s", TXT.s);
      add("pill", TXT.pills.map((p, i) => `<b class="${i === 2 ? "m" : ""}">${p}</b>`).join(""));
      // a loose stack of real widgets on the right
      card(c, "clock", 0, "left: 1010px; top: 110px; width: 480px; transform: rotate(-4deg);");
      card(c, "weather", 2, "left: 1450px; top: 60px; width: 420px; transform: rotate(4deg);");
      card(c, "sysinfo", 5, "left: 1040px; top: 480px; width: 400px; transform: rotate(3deg);");
      card(c, "media", 1, "left: 1360px; top: 560px; width: 500px; transform: rotate(-3deg);");
    } else {
      const wall = add("wall", "");
      const W = ["clock", "weather", "sysinfo", "calendar", "media", "todo", "flipclock", "forecast", "usage", "pomodoro", "notes", "currency",
        "analogclock", "netspeed", "worldclock", "habits", "airquality", "whitenoise", "calculator", "photoframe", "timer", "rss", "sunmoon", "countdown"];
      W.forEach((f, i) => card(wall, f, i % 6));
      add("shade", "");
      add("n", "38");
      add("u", TXT.u);
      add("s", TXT.s2);
      brand("left: 116px; top: 900px;");
    }
    const imgs = [...document.images];
    const readyP = Promise.all(imgs.map((i) => i.complete ? 0 : new Promise((r) => { i.onload = i.onerror = r; })))
      .then(() => document.fonts.ready).then(() => new Promise((r) => setTimeout(r, 300))).then(() => true);
    window.PROMO_ASSET = readyP;
  </script>
</body>
</html>
